<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>方块世界 · 生存史诗</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #78a7ff; font-family: "Microsoft YaHei", system-ui, sans-serif; }
  #c { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .pixfont { font-family: "SimSun", monospace; letter-spacing: 1px; }

  /* HUD */
  #crosshair { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); color: rgba(255,255,255,.85); font-size: 22px; pointer-events: none; text-shadow: 0 0 2px #000; z-index: 5; }
  #hud { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 6; pointer-events: none; }
  #hotbar { display: flex; gap: 0; background: rgba(20,20,20,.55); padding: 3px; border: 2px solid rgba(255,255,255,.25); border-radius: 4px; pointer-events: auto; }
  .hbslot { width: 46px; height: 46px; border: 2px solid rgba(255,255,255,.2); margin: 1px; position: relative; background: rgba(0,0,0,.25); }
  .hbslot.sel { border: 2px solid #fff; box-shadow: 0 0 6px rgba(255,255,255,.7); }
  .hbnum { position: absolute; left: 2px; top: 0; font-size: 9px; color: rgba(255,255,255,.55); }
  .hbicon { position: absolute; inset: 3px; }
  .hbicon img { width: 100%; height: 100%; image-rendering: pixelated; }
  .cnt { position: absolute; right: 2px; bottom: 0; color: #fff; font-size: 13px; font-weight: bold; text-shadow: 1px 1px 0 #000; }
  .durbar { position: absolute; left: 3px; right: 3px; bottom: 3px; height: 3px; background: #222; border-radius: 2px; overflow: hidden; }
  .durbar div { height: 100%; }
  #hearts { position: fixed; left: 50%; bottom: 64px; transform: translateX(-246px); z-index: 6; display: flex; gap: 1px; }
  #hunger { position: fixed; left: 50%; bottom: 64px; transform: translateX(58px); z-index: 6; display: flex; gap: 1px; flex-direction: row-reverse; }
  .heart, .food, .air { font-size: 17px; text-shadow: 1px 1px 0 #000; }
  .heart.full { color: #ff3a3a; } .heart.half { color: #ff3a3a; opacity: .6; } .heart.empty { color: #3a3a3a; }
  .food.full { } .food.half { opacity: .6; } .food.empty { filter: grayscale(1) brightness(.4); }
  .air { color: #9fd8ff; }
  #bowpower { display: none; position: fixed; left: 50%; top: 58%; transform: translateX(-50%); width: 120px; height: 8px; background: rgba(0,0,0,.5); border: 1px solid #fff; z-index: 6; }
  #bowpower::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--p) * 100%); background: #ffd24a; }
  #redflash { position: fixed; inset: 0; background: radial-gradient(ellipse, transparent 40%, rgba(200,0,0,.55)); opacity: 0; pointer-events: none; z-index: 7; }
  #toast { position: fixed; top: 18%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.72); color: #ffe37a; padding: 8px 22px; border-radius: 6px; font-size: 16px; opacity: 0; transition: opacity .3s; z-index: 9; pointer-events: none; }
  #toast.show { opacity: 1; }
  #f3 { display: none; position: fixed; left: 8px; top: 8px; color: #fff; font-size: 12px; font-family: monospace; text-shadow: 1px 1px 0 #000; white-space: pre; z-index: 8; pointer-events: none; }

  /* 背包窗口 */
  #inv-screen { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; align-items: center; justify-content: center; }
  .win { background: #c6c6c6; border: 3px solid; border-color: #fff #555 #555 #fff; padding: 10px 12px; min-width: 428px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .wtitle { color: #3a3a3a; font-weight: bold; margin-bottom: 6px; font-size: 15px; }
  .wx { float: right; cursor: pointer; color: #733; padding: 0 6px; }
  .slot { width: 44px; height: 44px; background: #8b8b8b; border: 2px solid; border-color: #373737 #fff #fff #373737; position: relative; display: inline-block; vertical-align: top; }
  .slot:hover { background: #a8a8a8; }
  .slot img { width: 100%; height: 100%; image-rendering: pixelated; position: absolute; inset: 2px; }
  .slot .cnt { z-index: 1; }
  .bag-area { display: grid; grid-template-columns: repeat(9, 48px); gap: 2px; margin-top: 8px; }
  .hotbar-area { display: grid; grid-template-columns: repeat(9, 48px); gap: 2px; margin-top: 8px; }
  .craft-area { display: flex; align-items: center; gap: 12px; margin: 6px 0 10px; }
  .cgrid { display: grid; gap: 2px; }
  .carrow { font-size: 22px; color: #3a3a3a; }
  .chest-area { display: grid; grid-template-columns: repeat(9, 48px); gap: 2px; margin-bottom: 8px; }
  .furnace-area { display: flex; align-items: center; gap: 10px; margin: 10px 0 16px; }
  .fslot { width: 44px; height: 44px; background: #8b8b8b; border: 2px solid; border-color: #373737 #fff #fff #373737; position: relative; }
  .fslot img { width: 100%; height: 100%; image-rendering: pixelated; position: absolute; inset: 2px; }
  .fflame { width: 22px; height: 22px; background: #555; position: relative; overflow: hidden; border-radius: 3px; }
  .fflame .fire { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(#ffdd55, #ff7711); }
  .farrow { width: 60px; height: 10px; background: #777; position: relative; }
  .farrow .prog { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; }
  #cursor-item { position: fixed; z-index: 99; pointer-events: none; width: 40px; height: 40px; }
  #cursor-item img { width: 100%; height: 100%; image-rendering: pixelated; }
  #cursor-item span { position: absolute; right: 0; bottom: 0; color: #fff; font-size: 13px; font-weight: bold; text-shadow: 1px 1px 0 #000; }

  /* 菜单 */
  .overlay { display: none; position: fixed; inset: 0; z-index: 30; align-items: center; justify-content: center; flex-direction: column; }
  #pause, #death, #sleep, #settings, #title { background: rgba(0,0,0,.55); }
  #death { background: rgba(120,0,0,.5); }
  .menu { display: flex; flex-direction: column; gap: 10px; min-width: 260px; }
  .mbtn { padding: 12px 20px; background: #7a7a7a; color: #fff; text-align: center; border: 2px solid #a0a0a0; cursor: pointer; font-size: 16px; text-shadow: 1px 1px 0 #333; }
  .mbtn:hover { background: #8b9bd4; border-color: #c3cff2; }
  .mtitle { color: #fff; font-size: 28px; margin-bottom: 14px; text-shadow: 2px 2px 0 #222; text-align: center; }
  #title .mtitle { font-size: 44px; color: #ffe37a; }
  .subtitle { color: #ddd; font-size: 13px; margin-bottom: 18px; text-align: center; text-shadow: 1px 1px 0 #222; }
  #seed-input { padding: 10px; border: 2px solid #888; background: #222; color: #fff; font-size: 15px; width: 100%; }
  .setrow { display: flex; align-items: center; gap: 10px; color: #fff; background: rgba(0,0,0,.3); padding: 8px 12px; }
  .setrow input[type=range] { flex: 1; }

  /* 触屏 */
  #touch-ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: none; }
  body.touching #touch-ui { display: block; }
  #joy-zone { position: absolute; left: 0; bottom: 0; width: 45%; height: 55%; pointer-events: auto; }
  #joy-base { display: none; position: absolute; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.35); }
  #joy-knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.4); }
  #look-zone { position: absolute; right: 0; top: 0; width: 55%; height: 100%; pointer-events: auto; }
  #t-btns { position: absolute; right: 14px; bottom: 90px; display: grid; grid-template-columns: 56px 56px; gap: 10px; pointer-events: auto; }
  .tbtn { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.22); border: 2px solid rgba(255,255,255,.4); color: #fff; font-size: 17px; display: flex; align-items: center; justify-content: center; text-shadow: 1px 1px 0 #000; }
  .tbtn:active { background: rgba(255,255,255,.5); }
  .tbtn.small { width: 46px; height: 46px; font-size: 14px; }
  @media (max-width: 720px) {
    .win { min-width: 0; transform: scale(.92); }
    .hbslot { width: 36px; height: 36px; }
    #hearts { transform: translateX(-196px); } #hunger { transform: translateX(44px); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="crosshair">+</div>
<div id="hearts"></div>
<div id="hunger"></div>
<div id="air"></div>
<div id="bowpower"></div>
<div id="redflash"></div>
<div id="toast"></div>
<div id="f3"></div>
<div id="hud"><div id="hotbar"></div></div>

<div id="inv-screen"></div>

<div id="pause" class="overlay">
  <div class="mtitle">游戏暂停</div>
  <div class="menu">
    <div class="mbtn" id="btn-resume">继续游戏</div>
    <div class="mbtn" id="btn-save">保存世界</div>
    <div class="mbtn" id="btn-set">设置</div>
    <div class="mbtn" id="btn-quit">保存并回主菜单</div>
  </div>
</div>

<div id="settings" class="overlay">
  <div class="mtitle">设置</div>
  <div class="menu" style="min-width:340px">
    <div class="setrow">渲染距离 <input type="range" id="set-dist" min="2" max="7" value="4"><span id="set-dist-v">4</span></div>
    <div class="setrow">音量 <input type="range" id="set-vol" min="0" max="100" value="50"></div>
    <div class="setrow">音乐 <input type="checkbox" id="set-music" checked></div>
    <div class="setrow">允许飞行（按 F） <input type="checkbox" id="set-fly" checked></div>
    <div class="mbtn" id="btn-set-back">返回</div>
  </div>
</div>

<div id="death" class="overlay">
  <div class="mtitle">你死了！</div>
  <div class="subtitle" id="death-msg">物品已掉落在原地</div>
  <div class="menu">
    <div class="mbtn" id="btn-respawn">重生</div>
  </div>
</div>

<div id="sleep" class="overlay">
  <div class="mtitle">夜深了…</div>
  <div class="subtitle">正在睡觉</div>
  <div class="menu"><div class="mbtn" id="btn-wake">起床</div></div>
</div>

<div id="title" class="overlay">
  <div class="mtitle">方块世界 · 生存史诗</div>
  <div class="subtitle">挖矿 · 合成 · 战斗 · 种田 · 驯养 —— 全复刻网页版</div>
  <div class="menu">
    <input id="seed-input" placeholder="世界种子（留空随机）">
    <div class="mbtn" id="btn-new">创建新世界</div>
    <div class="mbtn" id="btn-continue">继续上次的世界</div>
  </div>
</div>

<div id="boot-tip" style="display:none; position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:99; color:#fff; background:rgba(0,0,0,.7); padding:8px 16px; border-radius:6px; font-size:13px;"></div>
<script>
  // 白屏兜底：5 秒还没启动就给出提示（区分加载慢/网络/浏览器不支持）
  setTimeout(() => {
    const g = window.__game;
    if (!g || !g.started) {
      const tip = document.getElementById('boot-tip');
      tip.style.display = 'block';
      tip.textContent = '加载较慢或失败：请检查网络（本站需要能访问 github.io），或换 Chrome/Edge 新版浏览器后刷新';
    }
  }, 5000);
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
